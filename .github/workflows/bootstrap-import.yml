name: Bootstrap Import

# One-time, manual-only. The very first CI/CD roles a project needs are a
# chicken-and-egg problem: OpenTofu can't create detect-respond-gha-plan/
# -apply via CI, because CI can't assume a role that doesn't exist yet to
# run OpenTofu in the first place. Those 7 resources (2 roles, 2 policies,
# 3 attachments) were created directly via AWS CLI as a one-time bootstrap
# instead — this workflow imports them into OpenTofu state so the real
# apply.yml reconciles cleanly (0 changes on these 7) instead of erroring
# "already exists". Delete this file once the import has succeeded and
# been verified — it has no ongoing purpose after that.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::351668480009:role/detect-respond-gha-apply
          aws-region: us-east-1

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.5"

      - name: tofu init
        working-directory: opentofu
        run: tofu init

      # Ran once already (2026-08-24) and succeeded — all 7 bootstrap
      # resources are confirmed in state (verified via the plan step
      # below: 0 changes on any of them). Left as a comment, not deleted
      # outright, so the exact commands are on record in case state is
      # ever lost and this needs redoing:
      #   tofu import -input=false aws_iam_role.gha_plan detect-respond-gha-plan
      #   tofu import -input=false aws_iam_role.gha_apply detect-respond-gha-apply
      #   tofu import -input=false aws_iam_policy.gha_read arn:aws:iam::351668480009:policy/detect-respond-gha-read
      #   tofu import -input=false aws_iam_policy.gha_write arn:aws:iam::351668480009:policy/detect-respond-gha-write
      #   tofu import -input=false aws_iam_role_policy_attachment.gha_plan_read detect-respond-gha-plan/arn:aws:iam::351668480009:policy/detect-respond-gha-read
      #   tofu import -input=false aws_iam_role_policy_attachment.gha_apply_read detect-respond-gha-apply/arn:aws:iam::351668480009:policy/detect-respond-gha-read
      #   tofu import -input=false aws_iam_role_policy_attachment.gha_apply_write detect-respond-gha-apply/arn:aws:iam::351668480009:policy/detect-respond-gha-write

      # A prior apply attempt's aws_s3_bucket.cloudtrail create succeeded,
      # but a subsequent read-after-write on the same resource failed
      # (missing s3:GetBucketCors at the time — since fixed), so OpenTofu
      # marked it tainted: "not confident this is in a known-good state,
      # destroy and recreate next time." Untainting instead of granting
      # s3:DeleteBucket to the CI role — a real, permanent permission
      # increase on this project's own audit-log bucket — just to work
      # around a since-fixed transient failure isn't the right tradeoff.
      # `|| true`: harmless if the resource isn't (or is no longer) tainted.
      - name: Untaint aws_s3_bucket.cloudtrail if needed
        working-directory: opentofu
        run: tofu untaint aws_s3_bucket.cloudtrail || true

      - name: tofu plan (verify 0 changes on the imported resources)
        working-directory: opentofu
        shell: bash
        run: |
          set -o pipefail
          tofu plan -no-color -input=false | tee plan.txt
          {
            echo '## tofu plan (post-import)'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
